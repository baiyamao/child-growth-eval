name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: echo "Build complete"

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@latest
      - run: npm ci
      # package-lock.json was generated on macOS; npm may omit Rollup's Linux
      # optional binary from a cross-platform lockfile (npm/cli#4828).
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.46.2
      - run: npm run build
      - run: npm publish --provenance
